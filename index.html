const { useEffect, useRef, useState } = React;

/* shared scroll state for snow attraction */
let scrollFlashP = 0;
const FORMSPREE_ENDPOINT = "COLE_AQUI_O_ENDPOINT_FORMSPREE";

const Icon = ({ children, size = 24, strokeWidth = 2, ...props }) => (

/* ─── Snow ─── */
function Snow() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    let raf;
    const N = 120;
    const ps = [];
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener("resize", resize);
    for (let i = 0; i < N; i++) ps.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 2.5 + 0.5,
      speed: Math.random() * 0.8 + 0.3,
      drift: Math.random() * 0.4 - 0.2,
      opacity: Math.random() * 0.07 + 0.02,
    });
    const draw = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const fp = scrollFlashP;
      for (const p of ps) {
        const displayOpacity = Math.max(0, p.opacity * (1 - fp * 2.2));
        if (displayOpacity > 0.002) {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${displayOpacity})`; ctx.fill();
        }
        if (fp > 0.05) {
          const tx = canvas.width, ty = 0;
          const dx = tx - p.x, dy = ty - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = fp * 5;
          p.x += (dx / dist) * force;
          p.y += (dy / dist) * force;
          if (dist < 25 || p.x > canvas.width + 10 || p.y < -10) {
            p.x = Math.random() * canvas.width;
            p.y = canvas.height * 0.3 + Math.random() * canvas.height * 0.7;
          }
        } else {
          p.y += p.speed; p.x += p.drift;
          if (p.y > canvas.height + 5) { p.y = -5; p.x = Math.random() * canvas.width; }
          if (p.x > canvas.width + 5) p.x = -5;
          if (p.x < -5) p.x = canvas.width + 5;
        }
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none" style={{ zIndex: 5 }} />;
}

/* ─── HeroVideo: fade-in from start, loop 1s around middle ─── */
const LOOP_DURATION = 1;
function HeroVideo() {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const loopStartRef = useRef(null);
  const loopingRef = useRef(false);
  useEffect(() => {
    const video = ref.current;
    if (!video) return;
    const cancelFade = () => { if (rafRef.current != null) { cancelAnimationFrame(rafRef.current); rafRef.current = null; } };
    const fadeIn = () => {
      cancelFade();
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / 800);
        video.style.opacity = String(t);
        if (t < 1) rafRef.current = requestAnimationFrame(step); else rafRef.current = null;
      };
      rafRef.current = requestAnimationFrame(step);
    };
    const onLoaded = () => {
      const mid = video.duration / 2;
      loopStartRef.current = Math.max(0, mid - LOOP_DURATION / 2);
      loopingRef.current = false;
      video.currentTime = 0;
      video.style.opacity = "0";
      video.play().catch(() => {});
      fadeIn();
    };
    const onTimeUpdate = () => {
      const loopStart = loopStartRef.current;
      if (loopStart === null) return;
      const loopEnd = loopStart + LOOP_DURATION;
      if (!loopingRef.current && video.currentTime >= loopStart) loopingRef.current = true;
      if (loopingRef.current && video.currentTime >= loopEnd) video.currentTime = loopStart;
    };
    video.style.opacity = "0";
    video.addEventListener("loadeddata", onLoaded);
    video.addEventListener("timeupdate", onTimeUpdate);
    if (video.readyState >= 2) onLoaded();
    return () => { cancelFade(); video.removeEventListener("loadeddata", onLoaded); video.removeEventListener("timeupdate", onTimeUpdate); };
  }, []);
  return (
    <video id="hero-video" ref={ref} className="absolute inset-0 w-full h-full object-cover"
      style={{ opacity: 0, objectPosition: "center 80%" }}
      src="uploads/0521.mp4" muted autoPlay playsInline preload="auto" />
  );
}

/* ─── Reveal: scroll-triggered animations via IntersectionObserver ─── */
function useReveal(threshold = 0.12) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } },
      { threshold }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, visible];
}

function Reveal({ children, delay = 0, variant = "fadeUp", className = "", style = {} }) {
  const [ref, visible] = useReveal();
  const ease = "cubic-bezier(0.16,1,0.3,1)";
  const tr  = `opacity 0.85s ${ease} ${delay}ms, transform 0.85s ${ease} ${delay}ms`;
  const trF = `opacity 1s ease ${delay}ms`;
  const v = {
    fadeUp:    { opacity: visible?1:0, transform: visible?"translateY(0)":"translateY(48px)",                      transition: tr  },
    fadeLeft:  { opacity: visible?1:0, transform: visible?"translateX(0)":"translateX(-60px)",                     transition: tr  },
    fadeRight: { opacity: visible?1:0, transform: visible?"translateX(0)":"translateX(60px)",                      transition: tr  },
    scale:     { opacity: visible?1:0, transform: visible?"scale(1) translateY(0)":"scale(0.88) translateY(24px)", transition: tr  },
    fade:      { opacity: visible?1:0,                                                                             transition: trF },
  };
  return (
    <div ref={ref} className={className} style={{ ...(v[variant] ?? v.fadeUp), ...style }}>
      {children}
    </div>
  );
}

/* ─── StatNumber: animated counter on scroll ─── */
function StatNumber({ to, suffix = "", duration = 1300 }) {
  const [ref, visible] = useReveal(0.4);
  const [val, setVal] = useState(0);
  const started = useRef(false);
  useEffect(() => {
    if (!visible || started.current) return;
    started.current = true;
    const t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / duration);
      setVal(Math.round((1 - Math.pow(1 - p, 3)) * to));
      if (p < 1) requestAnimationFrame(tick); else setVal(to);
    };
    requestAnimationFrame(tick);
  }, [visible, to, duration]);
  return (
    <div ref={ref} className="text-3xl md:text-4xl text-white"
      style={{ fontFamily: "'Instrument Serif', serif" }}>{val}{suffix}</div>
  );
}

function formatNoticiaData(iso) {
  if (!iso) return "";
  const parsed = new Date(`${iso}T00:00:00`);
  if (Number.isNaN(parsed.getTime())) return iso;
  return parsed.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
}

function NewsEditorialGrid() {
  const [items, setItems] = useState(null);
  const [activeFilter, setActiveFilter] = useState(null);
  const filters = [
    { label: "TODOS", category: null },
    { label: "NOVIDADES", category: "NOVIDADES" },
    { label: "ENTREVISTAS", category: "ENTREVISTA" },
    { label: "CIÊNCIA", category: "CIÊNCIA" },
  ];

  useEffect(() => {
    let active = true;
    fetch("noticias/noticias.json")
      .then((res) => (res.ok ? res.json() : []))
      .then((data) => {
        if (!active) return;
        const valid = Array.isArray(data) ? data.filter((n) => typeof n.imagem === "string" && n.imagem.trim() !== "") : [];
        const sorted = valid.sort((a, b) => new Date(b.data) - new Date(a.data));
        setItems(sorted);
      })
      .catch(() => { if (active) setItems([]); });
    return () => { active = false; };
  }, []);

  if (items === null) return null;

  if (items.length === 0) {
    return <p className="mt-14 text-black/40 text-sm">Em breve, novidades da EBMU por aqui.</p>;
  }

  const selectedFilter = filters.find((filter) => filter.label === activeFilter);
  const visibleItems = !selectedFilter
    ? items.slice(0, 3)
    : selectedFilter.category
      ? items.filter((item) => item.categoria?.toLocaleUpperCase("pt-BR") === selectedFilter.category)
      : items;

  return (
    <div className="mt-14">
      <div className="news-filter-scroll -mx-1 overflow-x-auto px-1">
        <div role="group" aria-label="Filtrar publicações por categoria" className="flex w-max min-w-full gap-7 md:gap-10">
          {filters.map((filter) => (
            <button
              key={filter.label}
              type="button"
              aria-pressed={activeFilter === filter.label}
              onClick={() => setActiveFilter(filter.label)}
              className={`whitespace-nowrap border-b-2 py-2 text-xs tracking-[0.16em] transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-black ${activeFilter === filter.label ? "border-black text-black font-medium" : "border-transparent text-black/50 hover:text-black"}`}
            >
              {filter.label}
            </button>
          ))}
        </div>
      </div>
      <div className="mt-8 grid grid-cols-1 gap-x-8 gap-y-12 md:grid-cols-2 lg:grid-cols-3">
        {visibleItems.map((item) => <NewsCard key={item.id} item={item} />)}
      </div>
    </div>
  );
}

  const submit = async (event) => {
    event.preventDefault();
    setStatusMessage("");

    const formElement = event.currentTarget;
    if (!formElement.checkValidity()) {
      formElement.reportValidity();
      return;
    }

    setIsSubmitting(true);
    try {
      const response = await fetch("https://formspree.io/f/xrpbqwad", {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new FormData(formElement),
      });

      if (!response.ok) throw new Error("Formspree request failed");

      await response.json();
      setStatusMessage("Você está na lista.\nAvisaremos quando houver novidades sobre a Metodologia N.");
      setForm({ nome: "", idade: "", profissao: "", email: "", area_interesse: "" });
      formElement.reset();

/* ─── Section: Contato ─── */
function ContatoSection() {
  const [form, setForm] = useState({ nome: "", email: "", assunto: "", mensagem: "" });
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [statusMessage, setStatusMessage] = useState("");
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const submit = async (e) => {
    e.preventDefault();
    setStatusMessage("");

    const formEl = e.currentTarget;
    const isValid = formEl.checkValidity();
    if (!isValid) {
      formEl.reportValidity();
      return;
    }

    setIsSubmitting(true);

    try {
      const response = await fetch("https://formspree.io/f/mrpbgjow", {
        method: "POST",
        headers: {
          Accept: "application/json",
        },
        body: new FormData(formEl),
      });

      if (!response.ok) {
        throw new Error("Formspree request failed");
      }

      setStatusMessage("Mensagem enviada com sucesso. Obrigado pelo contato.");
      setForm({ nome: "", email: "", assunto: "", mensagem: "" });
      formEl.reset();
    } catch (error) {
      setStatusMessage("Não foi possível enviar a mensagem. Tente novamente em alguns instantes.");
    } finally {
      setIsSubmitting(false);
    }
  };

  const inputCls = "bg-white/5 border border-white/15 rounded-2xl px-4 py-3 text-white placeholder:text-white/40 text-sm outline-none focus:border-white/35 transition-colors w-full";
  return (
    <section id="contato" className="bg-black py-24 md:py-32 px-6 md:px-16 lg:px-24">
      <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-16 items-start">

            <h2 className="mt-4 text-4xl md:text-5xl text-white leading-tight"
              style={{ fontFamily: "'Instrument Serif', serif" }}>
              Fale com a gente
            </h2>
          </Reveal>
          <Reveal delay={180}>
            <p className="mt-6 text-white/60 text-base leading-relaxed max-w-sm">
              Tem dúvidas sobre os cursos, planos ou parcerias? Entre em contato.
            </p>
          </Reveal>
          <Reveal delay={260}>
            <div className="mt-10 flex flex-col gap-4">
              <a href="mailto:ebmu.plataforma@gmail.com"
                className="flex items-center gap-3 text-white/70 text-sm hover:text-white transition-colors">
                <span className="w-8 h-8 rounded-full border border-white/15 flex items-center justify-center text-white/40">@</span>
                ebmu.plataforma@gmail.com
              </a>
            </div>
          </Reveal>
        </div>

        <Reveal delay={120} variant="fadeUp">
          <form className="flex flex-col gap-4" onSubmit={submit}>
            <div className="grid grid-cols-2 gap-4">
              <input name="nome" value={form.nome} onChange={set("nome")} placeholder="Seu nome" className={inputCls} required />
              <input name="email" value={form.email} onChange={set("email")} placeholder="Seu e-mail" type="email" className={inputCls} required />
            </div>
            <input name="assunto" value={form.assunto} onChange={set("assunto")} placeholder="Assunto" className={inputCls} required />
            <textarea name="mensagem" value={form.mensagem} onChange={set("mensagem")} placeholder="Sua mensagem"
              rows={5} className={`${inputCls} resize-none`} required />
            <button type="submit" disabled={isSubmitting}
              className="mt-1 bg-white text-black rounded-full px-6 py-3 text-sm font-medium hover:bg-white/90 transition-colors flex items-center justify-center gap-2 self-start disabled:opacity-70 disabled:cursor-not-allowed">
              {isSubmitting ? "ENVIANDO..." : <>Enviar mensagem <ArrowRight size={15} /></>}
            </button>
            {statusMessage && (
              <p className="text-white/70 text-sm mt-1" role="status" aria-live="polite">
                {statusMessage}
              </p>
            )}
          </form>
        </Reveal>
      </div>
      <BackToHome dark />
    </section>
  );
}

    ["#loja", "Loja"], ["#comunidade", "Comunidade"], ["#perguntas", "Perguntas Frequentes"], ["#contato", "Contato"],
  ];

  useEffect(() => {
    const portal  = document.querySelector('.light-portal');
    const flash   = document.querySelector('.light-flash');
    const ray     = document.querySelector('.light-ray');
    const content = document.querySelector('.hero-content');
    const videoEl = document.getElementById('hero-video');
    const handle = () => {
      const vh = window.innerHeight;
      const s  = window.scrollY;
      // Build-up: portal (0→35%), flash (28→48%), ray mid-flash
      const gradP  = Math.min(1, Math.max(0, s / (vh * 0.35)));
      const flashP = Math.min(1, Math.max(0, (s - vh * 0.28) / (vh * 0.2)));
      const rawRay = flashP < 0.25 ? 0
        : flashP < 0.65 ? (flashP - 0.25) / 0.4
        : (1 - (flashP - 0.65) / 0.35);
      const rayP = Math.max(0, Math.min(1, rawRay));
      // Fade-down only after white gap covers the full top — video never reappears
      const fadeOut = Math.min(1, Math.max(0, (s - vh * 1.0) / (vh * 0.20)));
      const m = 1 - fadeOut;
      // Hero text disappears fast; video blurs with flash
      const textP  = Math.max(0, 1 - (s / (vh * 0.18)) * 1.5);
      scrollFlashP = flashP * m;
      if (window.innerWidth < 768) {
        // Mobile: hero scrolls normally, no flash/fade effects
        scrollFlashP = 0;
        if (portal)  portal.style.opacity  = "0";
        if (flash)   flash.style.opacity   = "0";
        if (ray)     ray.style.opacity     = "0";
        if (content) content.style.opacity = "1";
        if (videoEl) videoEl.style.filter  = "";
        return;
      }
      if (portal)  portal.style.opacity  = (gradP  * m).toString();
      if (flash)   flash.style.opacity   = (flashP * m).toString();
      if (ray)     ray.style.opacity     = (rayP   * m).toString();
      if (content) content.style.opacity = textP.toString();
      if (videoEl) videoEl.style.filter  = `blur(${(flashP * m * 8).toFixed(1)}px)`;
    };
    window.addEventListener('scroll', handle, { passive: true });
    window.addEventListener('resize', handle);
    handle();
    return () => { window.removeEventListener('scroll', handle); window.removeEventListener('resize', handle); };
  }, []);
  return (
    <>
      {/* Hero — sticky so the video backdrop stays visible as sections scroll over */}
      <div className="hero-shell relative overflow-hidden" style={{ position: 'sticky', top: 0, height: '100vh', zIndex: 0 }}>
        <HeroVideo />
        <Snow />
        <div className="light-portal" />
        <div className="light-flash" />
        <div className="light-ray" />
        <div className="hero-content relative z-10 flex flex-col min-h-screen">
          <nav className="relative z-20 px-6 md:px-8 py-6">
            <div className="flex items-center justify-between gap-8">
              <div className="flex items-center gap-8 max-md:shrink-0">
                <div className="flex items-center text-white font-semibold text-lg max-md:shrink-0">
                  <img src="uploads/fundoremovido2.png" alt="EBM University" className="h-10 w-auto" />
                </div>
                <div className="hidden md:flex items-center gap-6">
                  <a href="#a-ebmu"       className="text-white/80 hover:text-white transition-colors text-base font-medium">A EBMU</a>
                  <a href="#rodrigo-diniz" className="text-white/80 hover:text-white transition-colors text-base font-medium">Rodrigo Diniz</a>
                  <a href="#por-dentro"   className="text-white/80 hover:text-white transition-colors text-base font-medium">Por Dentro</a>
                  <a href="#planos"       className="text-white/80 hover:text-white transition-colors text-base font-medium">Planos</a>
                  <a href="#atividades"   className="text-white/80 hover:text-white transition-colors text-base font-medium">Atividades</a>
                  <a href="#metodo-n"     className="text-white/80 hover:text-white transition-colors text-base font-medium">Metodologia N</a>
                  <a href="#loja"         className="text-white/80 hover:text-white transition-colors text-base font-medium">Loja</a>
                  <a href="#comunidade"   className="text-white/80 hover:text-white transition-colors text-base font-medium">Comunidade</a>
                  <a href="#perguntas"    className="text-white/80 hover:text-white transition-colors text-base font-medium">Perguntas Frequentes</a>
                  <a href="#contato"      className="text-white/80 hover:text-white transition-colors text-base font-medium">Contato</a>
                </div>
              </div>
              <div className="flex items-center justify-end gap-4 mr-2 lg:mr-4 w-full max-w-sm">
                <button type="button" className="md:hidden text-white p-1" aria-label={menuOpen ? "Fechar menu" : "Abrir menu"} aria-expanded={menuOpen} aria-controls="mobile-menu"
                  onClick={() => setMenuOpen((o) => !o)}>
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
                    {menuOpen ? <><path d="M6 6l12 12"/><path d="M18 6L6 18"/></> : <><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></>}
                  </svg>
                </button>
                <a
                  href="https://sso.hotmart.com/login?service=https%3A%2F%2Fsso.hotmart.com%2Foauth2.0%2FcallbackAuthorize%3Fclient_id%3Db432cdd3-eb60-46bd-892b-5b450a65153e%26scope%3Dopenid%2Bprofile%2Bauthorities%2Bemail%2Bresources%2Buser%26redirect_uri%3Dhttps%253A%252F%252Fhotmart.com%252Fpt-br%252Fclub%252Febmu%252Fauth%252Flogin%253Frealm%253Dclub%26response_type%3Dcode%26response_mode%3Dquery%26state%3Dd76ed896a48341a5848a4507c6476417%26code_challenge%3DYFblDZHn9ui6olQGq80Y419-S692jqvcTvmyWZHHGsQ%26code_challenge_method%3DS256%26client_name%3DCasOAuthClient"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="rounded-lg px-[13px] py-[7px] bg-transparent text-white text-[13px] font-medium border border-white/80 shadow-none hover:bg-white/[0.08] hover:border-white/95 focus-visible:bg-white/[0.08] focus-visible:border-white/95 focus-visible:outline-none transition-colors duration-200 inline-block text-center whitespace-nowrap"
                >
                  Login
                </a>
              </div>
            </div>
            {menuOpen && (
              <div id="mobile-menu" className="md:hidden absolute left-4 right-4 top-full z-30 bg-black/85 backdrop-blur-md rounded-2xl p-3 flex flex-col max-h-[70vh] overflow-y-auto">
                {mobileNavLinks.map(([href, label]) => (
                  <a key={href} href={href} onClick={() => setMenuOpen(false)}
                    className="text-white/80 hover:text-white transition-colors text-base font-medium px-3 py-3 border-b border-white/10 last:border-b-0">{label}</a>
                ))}
              </div>
            )}
          </nav>

          <main className="relative z-10 flex-1 grid grid-cols-[auto_1fr_auto] grid-rows-[auto_auto] gap-x-8 gap-y-4 items-stretch content-center px-6 md:px-8 py-12 max-md:pt-4 max-[360px]:py-4 -translate-y-[8%] max-md:translate-y-0">
            <img src="uploads/fundoremovido2.png" alt="EBM University"
              className="row-start-1 col-start-1 max-md:col-span-3 max-md:w-full max-md:ml-0 object-contain w-56 md:w-72 lg:w-80 h-auto -ml-1 self-end" />

            <div className="row-start-2 col-start-1 max-md:col-span-3 flex flex-col items-start text-left max-w-md max-md:max-w-none md:max-w-lg gap-4 justify-start">
              <div className="text-white/90 text-xs md:text-sm leading-relaxed space-y-3">
                <p className="font-semibold">A maior plataforma de mindfulness do Brasil.</p>
                <p>
                  Dedicada ao estudo e à prática do mindfulness baseado em evidências científicas, a EBMU é um ambiente de aprendizagem contínua que integra ciência, prática e reflexão crítica.
                </p>
                <p>
                  Uma proposta educacional que explora as relações entre consciência, sofrimento psicológico e autorregulação emocional, promovendo uma compreensão mais profunda da experiência humana.
                </p>
              </div>
            </div>

            <div className="row-start-1 row-span-2 col-start-3 flex max-md:row-start-3 max-md:row-span-1 max-md:col-start-1 max-md:col-span-3 max-md:max-w-none max-md:mr-0 max-md:mt-6 bg-black/80 backdrop-blur-md rounded-2xl p-6 lg:p-7 w-full max-w-sm flex-col gap-4 text-left mr-2 lg:mr-4 self-stretch justify-between mt-[74px] lg:mt-[82px]">
              <div className="flex flex-col gap-1">
                <h2 className="text-2xl lg:text-3xl text-white tracking-tight"
                  style={{ fontFamily: "'Instrument Serif', serif" }}>
                  Receba nossa newsletter
                </h2>
                <div className="flex flex-col gap-4">
                  <p className="text-white/80 text-sm leading-relaxed">Entre no fluxo da EBMU.</p>
                  <p className="text-white/80 text-sm leading-relaxed">Você receberá orientações, novidades da comunidade, materiais para manter conexão conosco, práticas, reflexões, encontros, informações sobre nossos eventos e conteúdos sobre mindfulness baseado em evidências.</p>
                </div>
              </div>
              <form className="flex flex-col gap-3" onSubmit={(e) => {
                e.preventDefault();
                if (newsletterSubmitting) return;
                const form = e.currentTarget;
                const emailInput = form.elements.namedItem("email");
                if (!newsletterName.trim() || !email.trim() || !emailInput.checkValidity()) {
                  setNewsletterFeedback({ type: "error", message: "Preencha seu nome e um e-mail válido." });
                  return;
                }
                setNewsletterSubmitting(true);
                setNewsletterFeedback(null);
                const data = new FormData();
                data.append("nome", newsletterName.trim());
                data.append("email", email.trim());
                data.append("origem", "newsletter-ebmu");
                fetch("https://formspree.io/f/xrpbgjrw", {
                  method: "POST",
                  headers: { Accept: "application/json" },
                  body: data,
                })
                  .then((response) => {
                    if (!response.ok) throw new Error("Formspree request failed");
                    setNewsletterName("");
                    setEmail("");
                    setNewsletterFeedback({ type: "success", message: "Cadastro realizado com sucesso. Bem-vindo à newsletter da EBMU." });
                  })
                  .catch(() => {
                    setNewsletterFeedback({ type: "error", message: "Não foi possível realizar o cadastro. Tente novamente." });
                  })
                  .finally(() => setNewsletterSubmitting(false));
              }}>
                <label htmlFor="newsletter-name" className="sr-only">Seu nome</label>
                <input id="newsletter-name" name="nome" type="text" placeholder="Seu nome" value={newsletterName} onChange={(e) => setNewsletterName(e.target.value)} required
                  className="bg-white/5 border border-white/15 rounded-full px-4 py-2.5 text-white placeholder:text-white/40 text-sm outline-none focus:border-white/40 transition-colors" />
                <label htmlFor="newsletter-email" className="sr-only">Seu e-mail</label>
                <input id="newsletter-email" name="email" type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Seu e-mail" required autoComplete="email"
                  className="bg-white/5 border border-white/15 rounded-full px-4 py-2.5 text-white placeholder:text-white/40 text-sm outline-none focus:border-white/40 transition-colors" />
                <button type="submit" disabled={newsletterSubmitting}
                  className="bg-white text-black rounded-full px-5 py-2.5 text-sm font-medium hover:bg-white/90 transition-colors flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                  {newsletterSubmitting ? "Cadastrando..." : <>Inscrever-se <ArrowRight size={16} /></>}
                </button>
                {newsletterFeedback && (
                  <p role={newsletterFeedback.type === "error" ? "alert" : "status"} className={newsletterFeedback.type === "error" ? "text-red-200 text-xs leading-relaxed" : "text-white/80 text-xs leading-relaxed"}>
                    <span>{newsletterFeedback.message}</span>
                  </p>
                )}
              </form>
            </div>
          </main>
        </div>
      </div>

      {/* Sections scroll over the sticky hero backdrop; gaps reveal it between panels */}
      <div className="sections-wrapper" style={{ position: 'relative', zIndex: 1 }}>
        <SectionGap height="36vh" background="#fff" className="hero-to-sobre-gap" />
        <SobreSection />
        <SectionGap />
        <RodrigoDinizSection />
        <SectionGap />
        <PorDentroSection />
        <SectionGap />
        <PlanosSection />
        <SectionGap />
        <AtividadesSection />
        <SectionGap />
        <ComunidadeSection />
        <SectionGap />
        <MetodoNSection />
        <SectionGap />
        <LojaSection />
        <SectionGap />
        <PerguntasSection />
        <SectionGap />
        <ContatoSection />
        <FooterSection />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
